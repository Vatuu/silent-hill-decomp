name: Check Executables Match

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.ksy'

jobs:
  build:
    if: github.repository == 'shdecompilations/silent-hill-decomp'

    container: ghcr.io/shdecompilations/decomp-images-silent-hill:master

    strategy:
      fail-fast: false
      matrix:
        version: [ JAP0, USA, JAP1, EUR, JAP2 ]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: "Install Extra Dependencies"
        run: apt-get install -y binutils-mipsel-linux-gnu

      - name: "Setup Python"
        run: pip3 install -r requirements.txt --break-system-packages

      - name: "Copy Binaries"
        run: |
          mkdir -p assets rom
          cp -r -p /files/assets/${{ matrix.version }} assets/
          cp -r -p /files/rom/${{ matrix.version }} rom/

      - name: Generate Splits
        run: make GAME_VERSION=${{ matrix.version }} generate

      - name: Check Executables Match
        run: make GAME_VERSION=${{ matrix.version }} CHECKSUM=1 build
