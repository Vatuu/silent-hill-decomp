name: The MAP3_S03 map overlay (MAP3_S03)
sha1: fe5ce6d438b9434bc6c71b4d706a3710f5cb8ccd
options:
  basename: MAP3_S03.BIN
  target_path: assets/JAP2/VIN/MAP3_S03.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP2/maps/map3_s03
  src_path: src/maps/map3_s03
  build_path: build/JAP2

  ld_script_path: linkers/JAP2/maps/map3_s03.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/JAP1/sym.bodyprog.txt
    - configs/JAP2/maps/sym.map3_s03.txt
  reloc_addrs_path:
    - configs/JAP2/maps/rel.map3_s03.txt

  undefined_funcs_auto_path: linkers/JAP2/maps/undefined_funcs_auto.map3_s03.txt
  undefined_syms_auto_path: linkers/JAP2/maps/undefined_syms_auto.map3_s03.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map3_s03
    type: code
    start: 0
    vram: 0x800CBBD0
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, map3_s03_header]
      - [0x1050, .rodata, map3_s03]

      - [0x1F00, c, map3_s03_header]
      - [0x1F00, c, map3_s03_events_data]
      - [0x1F00, c, map3_s03_anim_info]

      # .text section
      - [0x1F00, c, map3_s03]

      # .data section
      - [0xB928, .data, map3_s03_anim_info]
      - [0xBB38, data]
      - [0xC7FC, .data, map3_s03_header]
      - [0xCE84, .data, map3_s03]
      - [0xCF78, .data, map3_s03_events_data]
      - [0xD5D8, data]
  - [0xF000]
