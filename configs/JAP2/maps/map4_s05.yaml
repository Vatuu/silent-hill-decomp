name: The MAP4_S05 map overlay (MAP4_S05)
sha1: 8206ca2b401ca8a6b5ba3350d0098c2ebdbc237f
options:
  basename: MAP4_S05.BIN
  target_path: assets/JAP2/VIN/MAP4_S05.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP2/maps/map4_s05
  src_path: src/maps/map4_s05
  build_path: build/JAP2

  ld_script_path: linkers/JAP2/maps/map4_s05.ld

  find_file_boundaries: False
  gp_value: 0x80022BB0
  global_vram_start: 0x80010000
  global_vram_end: 0x80200000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False # Disabled as our include_asm.h is customized to work with different game versions.

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
    - configs/JAP1/sym.bodyprog.txt
    - configs/JAP2/maps/sym.map4_s05.txt
  reloc_addrs_path:
    - configs/JAP2/maps/rel.map4_s05.txt

  undefined_funcs_auto_path: linkers/JAP2/maps/undefined_funcs_auto.map4_s05.txt
  undefined_syms_auto_path: linkers/JAP2/maps/undefined_syms_auto.map4_s05.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map4_s05
    type: code
    start: 0
    vram: 0x800CBBD0
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, map4_s05_header]
      - [0x1050, .rodata, map4_s05]
      - [0x16F9, rodata] # 3 random bytes, linker artifact, splat doesn't seem to write to .s so postbuild.py has to patch them back in.

      - [0x16FC, c, map4_s05_header]
      - [0x16FC, c, map4_s05_events_data]
      - [0x16FC, c, map4_s05_anim_info]

      # .text section
      - [0x16FC, c, map4_s05]

      # .data section
      - [0xE02C, .data, map4_s05_anim_info]
      - [0xE1BC, data]
      - [0xE58C, .data, map4_s05_header]
      - [0xE698, .data, map4_s05]
      - [0xE6E4, .data, map4_s05_events_data]
      - [0xE7BC, data]
  - [0x12500]
