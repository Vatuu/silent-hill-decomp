      - [0x1C24, c, map3_s01_anim_info]

      # .text section
      - [0x1C24, c, map3_s01]

      # .data section
      - [0xA41C, .data, map3_s01_anim_info]
      - [0xA60C, data]
      - [0xABF8, .data, map3_s01_header]
