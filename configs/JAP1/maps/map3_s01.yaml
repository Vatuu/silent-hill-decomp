  target_path: assets/JAP1/VIN/MAP3_S01.BIN
  base_path: ../../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP1/maps/map3_s01
  src_path: src/maps/map3_s01
  build_path: build/JAP1

  ld_script_path: linkers/JAP1/maps/map3_s01.ld

