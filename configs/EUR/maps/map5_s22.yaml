  undefined_syms_auto_path: linkers/EUR/maps/undefined_syms_auto.map5_s22.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: map5_s22
    type: code
    start: 0
    vram: 0x800CB370
    align: 4
    subalign: 4
    subsegments:
      # .rodata section
      - [0x0, rodata]
      - [0x4, .rodata, map5_s02_header]
      - [0x1050, .rodata, map5_s02_2]

      - [0x21A4, c, map5_s02_header]
      - [0x21A4, c, map5_s02_events_data]
      - [0x21A4, c, map5_s02_anim_info]
      # .text section
      - [0x21A4, c, map5_s02_2]

      # .data section
      - [0xDA10, .data, map5_s02_anim_info]
      - [0xDC80, data]
      - [0xFC68, .data, map5_s02_header]
      - [0xFD8C, .data, map5_s02_2]
      - [0xFE5C, .data, map5_s02_events_data]
      - [0xFF58, data]
  - [0x11500]
